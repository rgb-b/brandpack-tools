<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('app:theme') || 'default';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'default');
            }
        })();
    </script>
    <title>Density Profiles</title>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/base.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <style>
        body { min-height: 100vh; }

        .dp-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 0;
            height: calc(100vh - 52px);
            margin-top: 52px;
        }

        /* ── Left Panel ── */
        .dp-panel {
            background: var(--color-bg-card);
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: var(--spacing-lg);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .dp-panel h3 {
            font-size: var(--text-xs);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-text-muted);
            margin: 0;
        }

        .cmyk-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
        }

        .cmyk-field label {
            display: block;
            font-size: var(--text-xs);
            font-weight: 700;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
        }
        .cmyk-field.cyan    label { color: #5bb8d4; }
        .cmyk-field.magenta label { color: #e05a8a; }
        .cmyk-field.yellow  label { color: #d4b84a; }
        .cmyk-field.black   label { color: var(--color-text-muted); }

        .cmyk-field input {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--color-bg-hover);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-sm);
            color: var(--color-text-primary);
            font-size: var(--text-base);
            font-family: var(--font-mono);
            transition: border-color var(--transition-fast);
        }
        .cmyk-field input:focus {
            outline: none;
            border-color: var(--color-primary-light);
        }

        .filter-group { display: flex; flex-direction: column; gap: var(--spacing-sm); }

        .dp-panel select,
        .dp-panel input[type="text"] {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--color-bg-hover);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-sm);
            color: var(--color-text-primary);
            font-size: var(--text-sm);
        }
        .dp-panel select:focus,
        .dp-panel input[type="text"]:focus {
            outline: none;
            border-color: var(--color-primary-light);
        }

        .btn-clear {
            padding: var(--spacing-sm);
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-sm);
            color: var(--color-text-muted);
            font-size: var(--text-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .btn-clear:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }

        /* ── Results Panel ── */
        .dp-results {
            overflow-y: auto;
            padding: var(--spacing-lg);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .dp-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-sm);
        }

        .dp-count {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        /* ── Profile Card ── */
        .profile-card {
            background: var(--gradient-card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: border-color var(--transition-fast);
        }
        .profile-card:hover { border-color: rgba(255,255,255,0.18); }

        .profile-card.needs-review {
            border-left: 3px solid var(--color-error);
        }

        .profile-card-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md) var(--spacing-lg);
            cursor: pointer;
            user-select: none;
        }

        .profile-rank {
            font-size: var(--text-xs);
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--color-text-muted);
            min-width: 24px;
        }

        .profile-info { flex: 1; min-width: 0; }

        .profile-name {
            font-size: var(--text-base);
            font-weight: 600;
            color: var(--color-text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-meta {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: 3px;
            flex-wrap: wrap;
        }

        .meta-tag {
            font-size: var(--text-xs);
            color: var(--color-text-muted);
            background: rgba(255,255,255,0.05);
            border-radius: var(--radius-sm);
            padding: 1px 6px;
        }

        .review-badge {
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--color-error);
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: var(--radius-sm);
            padding: 1px 6px;
            white-space: nowrap;
        }

        .profile-cmyk {
            display: flex;
            gap: var(--spacing-sm);
            font-family: var(--font-mono);
            font-size: var(--text-sm);
        }

        .cmyk-val { display: flex; flex-direction: column; align-items: center; }
        .cmyk-val .lbl { font-size: 10px; font-weight: 700; }
        .cmyk-val.c .lbl { color: #5bb8d4; }
        .cmyk-val.m .lbl { color: #e05a8a; }
        .cmyk-val.y .lbl { color: #d4b84a; }
        .cmyk-val.k .lbl { color: var(--color-text-muted); }
        .cmyk-val .num { color: var(--color-text-primary); }
        .cmyk-val .num.null-val { color: var(--color-text-muted); }

        .distance-badge {
            font-size: var(--text-sm);
            font-family: var(--font-mono);
            font-weight: 700;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            white-space: nowrap;
        }
        .distance-badge.close  { background: rgba(16,185,129,0.15); color: var(--color-success); border: 1px solid rgba(16,185,129,0.3); }
        .distance-badge.medium { background: rgba(245,158,11,0.15); color: var(--color-warning); border: 1px solid rgba(245,158,11,0.3); }
        .distance-badge.far    { background: rgba(239,68,68,0.12);  color: var(--color-error);   border: 1px solid rgba(239,68,68,0.25); }
        .distance-badge.none   { display: none; }

        /* ── Expanded Edit Form ── */
        .profile-body {
            display: none;
            padding: var(--spacing-md) var(--spacing-lg) var(--spacing-lg);
            border-top: 1px solid rgba(255,255,255,0.06);
            gap: var(--spacing-md);
            flex-direction: column;
        }
        .profile-body.open { display: flex; }

        .edit-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
        }

        .edit-field { display: flex; flex-direction: column; gap: 4px; }
        .edit-field label { font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 600; }
        .edit-field input,
        .edit-field select,
        .edit-field textarea {
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--color-bg-hover);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-sm);
            color: var(--color-text-primary);
            font-size: var(--text-sm);
        }
        .edit-field input:focus,
        .edit-field select:focus { outline: none; border-color: var(--color-primary-light); }
        .edit-field textarea { resize: vertical; font-family: inherit; }
        .edit-field.span-2 { grid-column: span 2; }

        .cmyk-edit-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-sm);
        }

        .edit-actions { display: flex; gap: var(--spacing-sm); justify-content: flex-end; }

        /* ── Add Profile Form ── */
        .add-card {
            background: var(--gradient-card);
            border: 1px dashed rgba(255,255,255,0.15);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .add-card-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md) var(--spacing-lg);
            cursor: pointer;
            color: var(--color-text-muted);
            transition: color var(--transition-fast);
        }
        .add-card-header:hover { color: var(--color-text-primary); }
        .add-card-body {
            display: none;
            padding: var(--spacing-md) var(--spacing-lg) var(--spacing-lg);
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-direction: column;
            gap: var(--spacing-md);
        }
        .add-card-body.open { display: flex; }

        /* ── Incomplete Section ── */
        .section-divider {
            font-size: var(--text-xs);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-text-muted);
            padding: var(--spacing-sm) 0;
            border-top: 1px solid rgba(255,255,255,0.06);
            margin-top: var(--spacing-sm);
        }

        .profile-card.incomplete { opacity: 0.55; }
        .profile-card.incomplete:hover { opacity: 0.75; }

        /* ── Empty / Loading states ── */
        .dp-empty {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--color-text-muted);
        }

        @media (max-width: 768px) {
            .dp-layout { grid-template-columns: 1fr; height: auto; }
            .dp-panel { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
        }
    </style>
</head>
<body>
    <app-header tool-name="Density Profiles"></app-header>

    <div class="dp-layout">
        <!-- Left: Search + Filters -->
        <aside class="dp-panel">
            <div>
                <h3>Target Density</h3>
                <div class="cmyk-inputs" style="margin-top: var(--spacing-md);">
                    <div class="cmyk-field cyan">
                        <label>C</label>
                        <input type="number" id="inputC" min="0" max="4" step="0.01" placeholder="—">
                    </div>
                    <div class="cmyk-field magenta">
                        <label>M</label>
                        <input type="number" id="inputM" min="0" max="4" step="0.01" placeholder="—">
                    </div>
                    <div class="cmyk-field yellow">
                        <label>Y</label>
                        <input type="number" id="inputY" min="0" max="4" step="0.01" placeholder="—">
                    </div>
                    <div class="cmyk-field black">
                        <label>K</label>
                        <input type="number" id="inputK" min="0" max="4" step="0.01" placeholder="—">
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <h3>Filters</h3>
                <input type="text" id="filterText" placeholder="Search profile name…">
                <select id="filterPrinter">
                    <option value="">All Printers</option>
                </select>
                <select id="filterType">
                    <option value="">All Print Types</option>
                    <option value="RP">RP</option>
                    <option value="SP">SP</option>
                    <option value="CBW SP">CBW SP</option>
                </select>
                <button class="btn-clear" id="btnClear">Clear all</button>
            </div>
        </aside>

        <!-- Right: Results -->
        <main class="dp-results" id="results">
            <div class="dp-empty">Loading profiles…</div>
        </main>
    </div>

    <script type="module" src="./density-profiles.js"></script>
</body>
</html>
