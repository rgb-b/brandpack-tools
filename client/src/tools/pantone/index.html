<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Theme initialization - MUST run before CSS loads -->
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('app:theme') || 'default';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                // localStorage unavailable, use default
                document.documentElement.setAttribute('data-theme', 'default');
            }
        })();
    </script>

    <title>Colour Library</title>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/base.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <style>
        body {
            min-height: 100vh;
            padding: var(--spacing-lg);
        }

        .pantone-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        /* Setup Section */
        .setup-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }

        .upload-zone {
            width: 100%;
            max-width: 500px;
            padding: var(--spacing-2xl);
            background: var(--gradient-card);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-xl);
            text-align: center;
            transition: all var(--transition-base);
            cursor: pointer;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--color-primary-light);
            background: rgba(255, 140, 66, 0.05);
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: var(--spacing-md);
        }

        .upload-text {
            font-size: var(--text-lg);
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
        }

        .upload-hint {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        /* App Section */
        .app-section {
            display: none;
        }

        .app-section.active {
            display: block;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        /* Actions */
        .actions-bar {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
        }

        /* Search Bar */
        .search-bar {
            width: 100%;
            padding: var(--spacing-md);
            background: var(--color-bg-card);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            font-size: var(--text-base);
            margin-bottom: var(--spacing-md);
            transition: all var(--transition-base);
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--color-primary-light);
        }

        textarea.search-bar {
            min-height: 150px;
            font-family: var(--font-mono);
            resize: vertical;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-weight: 500;
            transition: all var(--transition-base);
            background: var(--color-bg-card);
            color: var(--color-text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .filter-tab.active {
            background: var(--gradient-primary);
            color: white;
            border-color: transparent;
        }

        .filter-tab:hover:not(.active) {
            background: var(--color-bg-hover);
        }

        /* Color List */
        .color-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .color-item {
            background: var(--gradient-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: var(--spacing-md);
            transition: all var(--transition-base);
        }

        .color-item:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .color-item.matched {
            border-left: 4px solid var(--color-success);
        }

        .color-item.not-matched {
            border-left: 4px solid var(--color-error);
        }

        .color-item.old-match {
            border-left: 4px solid var(--color-warning);
        }

        .color-info {
            flex: 1;
        }

        .color-name {
            font-size: var(--text-lg);
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .color-meta {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
            margin-bottom: var(--spacing-xs);
        }

        .warning-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: var(--radius-sm);
            padding: var(--spacing-sm);
            font-size: var(--text-sm);
            color: var(--color-warning);
            margin-top: var(--spacing-sm);
        }

        .warning-box.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--color-error);
        }

        .color-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: var(--spacing-sm);
        }

        .status-badge {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
            font-weight: 600;
            white-space: nowrap;
        }

        .status-badge.matched {
            background: rgba(16, 185, 129, 0.1);
            color: var(--color-success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.not-matched {
            background: rgba(239, 68, 68, 0.1);
            color: var(--color-error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-badge.old-match {
            background: rgba(245, 158, 11, 0.1);
            color: var(--color-warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* Multi Results */
        .multi-summary {
            background: var(--color-bg-card);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .multi-summary h3 {
            color: var(--color-primary-light);
            margin-bottom: var(--spacing-md);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-md);
        }

        .summary-item {
            text-align: center;
        }

        .summary-value {
            font-size: var(--text-2xl);
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .summary-label {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        /* Card styles */
        .pantone-card {
            background: var(--gradient-card);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .pantone-card.hidden {
            display: none;
        }

        .card-title {
            font-size: var(--text-xl);
            font-weight: 700;
            color: var(--color-primary-light);
            margin-bottom: var(--spacing-md);
        }

        .card-description {
            color: var(--color-text-muted);
            font-size: var(--text-sm);
            margin-bottom: var(--spacing-md);
        }

        /* Pagination Controls */
        .pagination-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-md);
            margin-top: var(--spacing-xl);
            padding: var(--spacing-md);
        }

        .pagination-controls .page-info {
            color: var(--color-text-secondary);
            font-size: var(--text-sm);
            min-width: 120px;
            text-align: center;
        }

        .pagination-controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .actions-bar {
                flex-direction: column;
            }

            .color-item {
                flex-direction: column;
            }

            .color-status {
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <app-header tool-name="Pantone Tracker"></app-header>

    <div class="pantone-container">
        <!-- Setup Section -->
        <!-- App Section -->
        <div class="app-section" id="appSection">
            <!-- Stats -->
            <div class="stats-grid" id="statsSection"></div>

            <!-- Actions -->
            <div class="actions-bar">
                <button class="btn btn-primary" onclick="window.pantoneApp.showSingleSearch()">🔍 Search Single Color</button>
                <button class="btn btn-primary" onclick="window.pantoneApp.showMultiCheck()">📋 Check Multiple Colors</button>
                <button class="btn btn-secondary" onclick="window.pantoneApp.exportData()">💾 Export Updated Data</button>
            </div>

            <!-- Single Search Card -->
            <div class="pantone-card" id="singleSearchCard">
                <h2 class="card-title">🔍 Search Pantone Color</h2>
                <input type="text" class="search-bar" id="searchInput" placeholder="Type Pantone name (e.g., 185 C, Blue 072 C, etc.)" oninput="window.pantoneApp.searchColors()">

                <!-- Collection and Color Space Filters -->
                <div style="display: flex; gap: var(--spacing-md); margin-bottom: var(--spacing-md); flex-wrap: wrap;">
                    <select id="collectionFilter" class="form-select" style="flex: 1; min-width: 200px;" onchange="window.pantoneApp.searchColors()">
                        <option value="">All Collections</option>
                        <!-- Populated dynamically -->
                    </select>

                    <div style="display: flex; gap: var(--spacing-md); align-items: center; flex-wrap: wrap;">
                        <label style="display: flex; align-items: center; gap: var(--spacing-xs); cursor: pointer;">
                            <input type="checkbox" id="filterRGB" onchange="window.pantoneApp.searchColors()">
                            <span>Has RGB</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: var(--spacing-xs); cursor: pointer;">
                            <input type="checkbox" id="filterCMYK" onchange="window.pantoneApp.searchColors()">
                            <span>Has CMYK</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: var(--spacing-xs); cursor: pointer;">
                            <input type="checkbox" id="filterLAB" onchange="window.pantoneApp.searchColors()">
                            <span>Has LAB</span>
                        </label>
                    </div>
                </div>

                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="window.pantoneApp.filterResults('all', event)">All</button>
                    <button class="filter-tab" onclick="window.pantoneApp.filterResults('matched', event)">✅ Matched</button>
                    <button class="filter-tab" onclick="window.pantoneApp.filterResults('not-matched', event)">❌ Not Matched</button>
                    <button class="filter-tab" onclick="window.pantoneApp.filterResults('old-match', event)">⚠️ Old (5+ years)</button>
                </div>

                <div class="color-list" id="searchResults"></div>

                <!-- Pagination Controls -->
                <div id="paginationControls" class="pagination-controls" style="display: none;">
                    <button class="btn btn-secondary prev-page" onclick="window.pantoneApp.prevPage()">← Previous</button>
                    <span class="page-info">Page 1 of 1</span>
                    <button class="btn btn-secondary next-page" onclick="window.pantoneApp.nextPage()">Next →</button>
                </div>
            </div>

            <!-- Multi Check Card -->
            <div class="pantone-card hidden" id="multiCheckCard">
                <h2 class="card-title">📋 Check Multiple Colors</h2>
                <p class="card-description">
                    Paste a list of Pantone colors (one per line) to check their match status:
                </p>
                <textarea class="search-bar" id="multiInput" placeholder="Example:&#10;185 C&#10;300 C&#10;Blue 072 C&#10;Process Black C"></textarea>
                <button class="btn btn-primary" style="margin-top: var(--spacing-md);" onclick="window.pantoneApp.checkMultiple()">Check Colors</button>

                <div id="multiResults" style="margin-top: var(--spacing-lg);"></div>
            </div>
        </div>
    </div>

    <app-footer></app-footer>
    <script type="module" src="./pantone.js"></script>
</body>
</html>
